openapi: 3.1.0
info:
  title: Facilit Hub API
  version: 0.7.1
  description: |
    Contrato oficial entre front-end e back-end do Facilit Hub.

    Convenções (valem para todas as rotas):
    - Sessão em cookie `__Host-hub_sessao` (HttpOnly, Secure, `SameSite=Strict`,
      `Path=/`). Front e API no MESMO domínio: o front chama `/api` relativo,
      sem CORS. Requisições que alteram dados (POST/PATCH/DELETE) têm o
      cabeçalho `Origin` conferido pela API; origem diferente = 403.
    - IDs são strings (UUID). Datas em ISO 8601 com fuso (`date-time`).
    - Erros sempre em `application/problem+json` (schema `Problema`), com
      `codigo` estável e, em validação, erros por campo.
    - **401** = sem sessão ou sessão expirada (o front leva ao login).
      **403** = sessão válida, mas sem permissão.
    - Listas paginam por cursor: `limite` + `cursor`; resposta traz
      `proximoCursor` (null no fim). Ordenação por `ordem` (`campo` ou `-campo`).
    - Toda operação tem `operationId`: o nome do hook gerado no front sai dele.
    - A autorização real é do back-end; `permissoes` em `GET /sessao` só
      orienta o front a esconder ações.
    - Organização (D-006): toda sessão pertence a UMA organização, e todo dado
      é filtrado por ela no back-end. O `organizacaoId` NUNCA vem do front
      (nem em query, nem em corpo): sai da sessão.
    - Responsáveis são **atores** (D-007): pessoa, agente de IA ou automação.
      Atribuições apontam para `atorId`, nunca para `usuarioId`.
    - Histórico (timeline) = eventos (D-009).
    - Escopo MVP (D-010, D-012): IA, análises, demandas e tarefas ficaram
      para fase posterior e NÃO estão neste contrato.
    - Nenhum campo de senha ou credencial de terceiros existe neste contrato
      (D-012): o Hub registra o que se usa e onde acessar, nunca como entrar.
servers:
  - url: /api
security:
  - sessao: []

tags:
  - name: sessao
    description: Login, logout e sessão atual
  - name: empresas
    description: Empresas da organização (Telensat, Rastremix, Mobiliza...)
  - name: atores
    description: Quem pode ser responsável — pessoas, agentes de IA e automações
  - name: projetos
    description: Projetos de cada empresa
  - name: eventos
    description: Timeline — eventos de domínio (somente leitura)
  - name: painel
    description: Home "Hoje na Facilitcorp" — números objetivos do grupo
  - name: documentos
    description: Documentos e links dos projetos (só links no MVP)

paths:
  /sessao:
    get:
      tags: [sessao]
      operationId: obterSessao
      summary: Usuário da sessão atual e suas permissões
      responses:
        '200':
          description: Sessão ativa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      tags: [sessao]
      operationId: entrar
      summary: Abre sessão (login). Define o cookie de sessão.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciais' }
      responses:
        '200':
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: Cookie de sessão HttpOnly
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
    delete:
      tags: [sessao]
      operationId: sair
      summary: Encerra a sessão (logout). Idempotente.
      responses:
        '204': { description: Sessão encerrada }

  /empresas:
    get:
      tags: [empresas]
      operationId: listarEmpresas
      summary: Lista empresas visíveis à sessão
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - name: ordem
          in: query
          schema: { type: string, enum: [nome, -nome, criadaEm, -criadaEm], default: nome }
        - name: busca
          in: query
          description: Filtro por nome (contém, sem diferenciar acento/caixa)
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/StatusEmpresa' }
      responses:
        '200':
          description: Página de empresas
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximoCursor]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Empresa' }
                  proximoCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      tags: [empresas]
      operationId: criarEmpresa
      summary: Cria empresa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaEntrada' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /empresas/{empresaId}:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [empresas]
      operationId: obterEmpresa
      summary: Detalhe da empresa
      responses:
        '200':
          description: Empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [empresas]
      operationId: atualizarEmpresa
      summary: Atualiza empresa (exige versao)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaAtualizacao' }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /empresas/{empresaId}/{imagem}:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - name: imagem
        in: path
        required: true
        schema: { type: string, enum: [logo, capa] }
    get:
      tags: [empresas]
      operationId: obterImagemEmpresa
      summary: Conteúdo do logo ou da capa (use a URL de `logoUrl`/`capaUrl`)
      parameters:
        - name: v
          in: query
          description: Versão da imagem; só serve para invalidar o cache do navegador
          schema: { type: integer }
      responses:
        '200':
          description: "Imagem (`Cache-Control: private`)"
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [empresas]
      operationId: enviarImagemEmpresa
      summary: Envia (ou troca) o logo ou a capa da empresa
      description: |
        PNG, JPEG ou WebP (SVG não: pode carregar script); o tipo é conferido
        pelo conteúdo. Logo até 2 MB, capa até 5 MB. Arquivo privado: a
        leitura é por `logoUrl`/`capaUrl`, na própria API, com a sessão (D-013).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo: { type: string, format: binary }
      responses:
        '200':
          description: Empresa com a nova URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '413':
          description: Arquivo maior que o limite
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    delete:
      tags: [empresas]
      operationId: removerImagemEmpresa
      summary: Remove o logo ou a capa
      responses:
        '200':
          description: Empresa sem a imagem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /atores:
    get:
      tags: [atores]
      operationId: listarAtores
      summary: Lista atores da organização (para escolher responsável)
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - name: tipo
          in: query
          schema: { $ref: '#/components/schemas/TipoAtor' }
        - name: ativo
          in: query
          schema: { type: boolean, default: true }
        - name: busca
          in: query
          description: Filtro por nome (contém, sem diferenciar acento/caixa)
          schema: { type: string, maxLength: 120 }
        - name: ordem
          in: query
          schema: { type: string, enum: [nome, -nome], default: nome }
      responses:
        '200':
          description: Página de atores
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximoCursor]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Ator' }
                  proximoCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /projetos:
    get:
      tags: [projetos]
      operationId: listarProjetos
      summary: Lista projetos visíveis à sessão
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - name: empresaId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/StatusProjeto' }
        - name: fase
          in: query
          schema: { $ref: '#/components/schemas/Fase' }
        - name: prioridade
          in: query
          schema: { $ref: '#/components/schemas/Prioridade' }
        - name: responsavelId
          in: query
          schema: { type: string, format: uuid }
        - name: prazoAte
          in: query
          description: Só projetos com `prazoPrevisto` até esta data (inclusive)
          schema: { type: string, format: date }
        - name: concluidoDesde
          in: query
          description: Só projetos com `concluidoEm` a partir deste instante
          schema: { type: string, format: date-time }
        - name: ordem
          in: query
          schema:
            type: string
            enum: [nome, -nome, prazoPrevisto, -prazoPrevisto, prioridade, -prioridade, atualizadoEm, -atualizadoEm, concluidoEm, -concluidoEm]
            default: -atualizadoEm
      responses:
        '200':
          description: Página de projetos
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximoCursor]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Projeto' }
                  proximoCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      tags: [projetos]
      operationId: criarProjeto
      summary: Cria projeto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjetoEntrada' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Projeto' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /projetos/{projetoId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [projetos]
      operationId: obterProjeto
      summary: Detalhe do projeto
      responses:
        '200':
          description: Projeto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Projeto' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [projetos]
      operationId: atualizarProjeto
      summary: Atualiza projeto (exige versao)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjetoAtualizacao' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Projeto' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /projetos/{projetoId}/atualizacoes:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [projetos]
      operationId: listarAtualizacoesProjeto
      summary: Atualizações do projeto, da mais recente para a mais antiga
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de atualizações
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximoCursor]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/NotaAndamento' }
                  proximoCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [projetos]
      operationId: registrarAtualizacaoProjeto
      summary: Registra uma atualização ("onde estamos"); autor = sessão
      description: |
        Não exige `versao`: atualização só se acrescenta, nunca conflita.
        Vira a `ultimaAtualizacao` do projeto e gera `project.updated` com a
        nota em `dados.notaAndamento`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotaAndamentoEntrada' }
      responses:
        '201':
          description: Registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotaAndamento' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /documentos:
    get:
      tags: [documentos]
      operationId: listarDocumentos
      summary: Documentos e links (menu Documentos e aba do projeto)
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - name: projetoId
          in: query
          schema: { type: string, format: uuid }
        - name: empresaId
          in: query
          schema: { type: string, format: uuid }
        - name: tipo
          in: query
          schema: { $ref: '#/components/schemas/TipoDocumento' }
        - name: busca
          in: query
          description: Filtro por nome (contém, sem diferenciar acento/caixa)
          schema: { type: string, maxLength: 120 }
        - name: ordem
          in: query
          schema: { type: string, enum: [nome, -nome, criadoEm, -criadoEm], default: -criadoEm }
      responses:
        '200':
          description: Página de documentos
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximoCursor]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Documento' }
                  proximoCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      tags: [documentos]
      operationId: criarDocumento
      summary: Registra um documento/link num projeto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentoEntrada' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /documentos/{documentoId}:
    parameters:
      - name: documentoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [documentos]
      operationId: atualizarDocumento
      summary: Atualiza documento/link (exige versao)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentoAtualizacao' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
    delete:
      tags: [documentos]
      operationId: removerDocumento
      summary: Remove documento/link. Idempotente.
      responses:
        '204': { description: Removido }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /painel:
    get:
      tags: [painel]
      operationId: obterPainel
      summary: Números da Home "Hoje na Facilitcorp" (sem IA, só contagem)
      description: |
        Contagens objetivas da organização da sessão. Cada número tem um
        filtro equivalente em `listarProjetos`, para o card abrir a lista:
        ativos = `status=em_andamento`; bloqueados = `status=bloqueado`;
        próximos do prazo = `prazoAte=hoje+janelaPrazoDias` e status não
        final (concluido/cancelado); concluídos recentemente =
        `concluidoDesde=agora-janelaConcluidosDias`.
      responses:
        '200':
          description: Painel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Painel' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /eventos:
    get:
      tags: [eventos]
      operationId: listarEventos
      summary: Timeline, do mais recente para o mais antigo (ou ao vivo com `depoisDe`)
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - name: empresaId
          in: query
          schema: { type: string, format: uuid }
        - name: projetoId
          in: query
          schema: { type: string, format: uuid }
        - name: tipo
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/TipoEvento' }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: depoisDe
          in: query
          description: |
            Timeline ao vivo: só eventos POSTERIORES a este `id`, em ordem
            CRESCENTE (mais antigo primeiro). `proximoCursor` segue para frente;
            null = está em dia. Não combina com `cursor`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximoCursor]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Evento' }
                  proximoCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: __Host-hub_sessao

  parameters:
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Valor opaco devolvido em `proximoCursor`
      schema: { type: string }
    EmpresaId:
      name: empresaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjetoId:
      name: projetoId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Invalido:
      description: Entrada inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoAutenticado:
      description: Sem sessão ou sessão expirada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemPermissao:
      description: Sessão válida, sem permissão para a ação
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoEncontrado:
      description: Não existe ou não é visível para a sessão
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflito:
      description: Versão desatualizada (outra pessoa alterou antes)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    MuitasTentativas:
      description: Limite de tentativas excedido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    Problema:
      type: object
      description: RFC 9457 (problem+json) com extensões do Hub
      required: [type, title, status, codigo]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          description: Código estável para o front tratar (ex. `sessao_expirada`, `sem_permissao`, `validacao`, `versao_desatualizada`)
        campos:
          type: array
          description: Erros por campo (só em validação)
          items:
            type: object
            required: [campo, codigo, mensagem]
            properties:
              campo: { type: string, description: 'Caminho do campo, ex. `nome`' }
              codigo: { type: string }
              mensagem: { type: string }

    Credenciais:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        senha: { type: string, minLength: 1, maxLength: 200, writeOnly: true }

    Sessao:
      type: object
      required: [usuario, organizacao, permissoes, expiraEm]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        organizacao: { $ref: '#/components/schemas/Organizacao' }
        permissoes:
          type: array
          description: Ações que a sessão pode executar (o back continua sendo quem nega)
          items: { $ref: '#/components/schemas/Permissao' }
        expiraEm: { type: string, format: date-time }

    Usuario:
      type: object
      required: [id, atorId, nome, email, papel]
      properties:
        id: { type: string, format: uuid }
        atorId:
          type: string
          format: uuid
          description: Ator (tipo `pessoa`) desta pessoa; é o id usado em atribuições
        nome: { type: string }
        email: { type: string, format: email }
        papel: { type: string, enum: [administrador, gestor, membro] }

    Permissao:
      type: string
      enum:
        - empresas.ler
        - empresas.criar
        - empresas.editar
        - projetos.ler
        - projetos.criar
        - projetos.editar
        - projetos.atualizar
        - documentos.ler
        - documentos.editar
        - atores.ler
        - eventos.ler

    Organizacao:
      type: object
      description: Raiz do isolamento de dados (hoje só a Facilitcorp)
      required: [id, nome]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }

    TipoAtor:
      type: string
      enum: [pessoa, agente, automacao]

    AtorResumo:
      type: object
      description: Forma curta de um ator, embutida onde há atribuição
      required: [id, tipo, nome, ativo]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoAtor' }
        nome: { type: string }
        ativo:
          type: boolean
          description: Inativo aparece no histórico, mas não recebe atribuição nova
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: URL assinada e temporária (arquivo privado); não guardar em cache longo

    Ator:
      allOf:
        - $ref: '#/components/schemas/AtorResumo'
        - type: object
          properties:
            descricao:
              type: [string, 'null']
              description: Ex. o que o agente ou a automação faz

    Telefone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: E.164 (ex. +5511999999999)

    Empresa:
      type: object
      description: |
        Empresa da organização. NÃO é tenant (D-006). Os projetos vinculados
        vêm de `listarProjetos?empresaId=`; aqui só os totais.
      required: [id, organizacaoId, nome, nomeFantasia, razaoSocial, slogan, descricaoCurta, descricao, segmento, status, logoUrl, capaUrl, cnpj, telefone, whatsapp, email, links, ferramentas, contatos, endereco, observacoes, responsaveis, totalProjetos, totalProjetosEmAndamento, empresaMaeId, criadaEm, atualizadaEm, versao]
      properties:
        id: { type: string, format: uuid }
        organizacaoId:
          type: string
          format: uuid
          description: Somente leitura; vem da sessão
        nome: { type: string, description: Como a empresa é chamada no grupo }
        nomeFantasia: { type: [string, 'null'] }
        razaoSocial: { type: [string, 'null'] }
        slogan: { type: [string, 'null'] }
        descricaoCurta:
          type: [string, 'null']
          description: Uma frase sobre o que a empresa faz (cards e cabeçalho)
        descricao:
          type: [string, 'null']
          description: Descrição completa
        segmento: { type: [string, 'null'], description: 'Texto livre, ex. "Rastreamento veicular"' }
        status: { $ref: '#/components/schemas/StatusEmpresa' }
        logoUrl:
          type: [string, 'null']
          format: uri-reference
          description: "Caminho na própria API (`/api/empresas/{id}/logo?v=N`), lido com a sessão (D-013). Muda quando a imagem muda."
        capaUrl:
          type: [string, 'null']
          format: uri-reference
          description: "Caminho na própria API (`/api/empresas/{id}/capa?v=N`), lido com a sessão (D-013)"
        cnpj:
          oneOf:
            - $ref: '#/components/schemas/Cnpj'
            - type: 'null'
        telefone:
          oneOf:
            - $ref: '#/components/schemas/Telefone'
            - type: 'null'
        whatsapp:
          description: O front monta o link wa.me
          oneOf:
            - $ref: '#/components/schemas/Telefone'
            - type: 'null'
        email: { type: [string, 'null'], format: email, description: E-mail principal }
        links:
          type: array
          description: Links e canais (site, redes sociais...), na ordem de exibição
          items: { $ref: '#/components/schemas/LinkEmpresa' }
        ferramentas:
          type: array
          description: Sistemas e ferramentas que a empresa usa (nunca credenciais)
          items: { $ref: '#/components/schemas/FerramentaEmpresa' }
        contatos:
          type: array
          description: Outros contatos
          items: { $ref: '#/components/schemas/ContatoEmpresa' }
        endereco:
          oneOf:
            - $ref: '#/components/schemas/Endereco'
            - type: 'null'
        observacoes:
          type: [string, 'null']
          description: Notas internas da gestão
        responsaveis:
          type: array
          items: { $ref: '#/components/schemas/ResponsavelEmpresa' }
        totalProjetos: { type: integer, minimum: 0 }
        totalProjetosEmAndamento: { type: integer, minimum: 0 }
        empresaMaeId:
          type: [string, 'null']
          format: uuid
          description: Sub-empresa dentro da MESMA organização; null quando fica direto sob ela
        criadaEm: { type: string, format: date-time }
        atualizadaEm: { type: string, format: date-time }
        versao:
          type: integer
          description: Controle de concorrência otimista; enviar no PATCH

    ContatoEmpresa:
      type: object
      description: Pessoa de contato da empresa (não é ator, não faz login)
      required: [nome]
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 2, maxLength: 160 }
        cargo: { type: [string, 'null'], maxLength: 120 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        telefone:
          oneOf:
            - $ref: '#/components/schemas/Telefone'
            - type: 'null'
        observacao: { type: [string, 'null'], maxLength: 500 }

    Endereco:
      type: object
      additionalProperties: false
      properties:
        logradouro: { type: [string, 'null'], maxLength: 200 }
        numero: { type: [string, 'null'], maxLength: 20 }
        complemento: { type: [string, 'null'], maxLength: 120 }
        bairro: { type: [string, 'null'], maxLength: 120 }
        cidade: { type: [string, 'null'], maxLength: 120 }
        uf: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        cep: { type: [string, 'null'], pattern: '^[0-9]{8}$', description: Só dígitos }
        pais: { type: string, default: BR, pattern: '^[A-Z]{2}$' }

    ResponsavelEmpresa:
      type: object
      required: [ator, papel]
      properties:
        ator: { $ref: '#/components/schemas/AtorResumo' }
        papel:
          type: [string, 'null']
          maxLength: 80
          description: Texto livre, ex. "Diretor", "Gestor de operações"

    ResponsavelEmpresaEntrada:
      type: object
      required: [atorId]
      additionalProperties: false
      properties:
        atorId: { type: string, format: uuid, description: Ator ativo }
        papel: { type: [string, 'null'], maxLength: 80 }

    EmpresaEntrada:
      type: object
      required: [nome]
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 2, maxLength: 160 }
        nomeFantasia: { type: [string, 'null'], maxLength: 160 }
        razaoSocial: { type: [string, 'null'], maxLength: 200 }
        slogan: { type: [string, 'null'], maxLength: 160 }
        descricaoCurta: { type: [string, 'null'], maxLength: 280 }
        descricao: { type: [string, 'null'], maxLength: 8000 }
        segmento: { type: [string, 'null'], maxLength: 120 }
        status: { $ref: '#/components/schemas/StatusEmpresa' }
        cnpj:
          oneOf:
            - $ref: '#/components/schemas/Cnpj'
            - type: 'null'
        telefone:
          oneOf:
            - $ref: '#/components/schemas/Telefone'
            - type: 'null'
        whatsapp:
          oneOf:
            - $ref: '#/components/schemas/Telefone'
            - type: 'null'
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        links:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/LinkEmpresa' }
        ferramentas:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FerramentaEmpresa' }
        contatos:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/ContatoEmpresa' }
        endereco:
          oneOf:
            - $ref: '#/components/schemas/Endereco'
            - type: 'null'
        observacoes: { type: [string, 'null'], maxLength: 8000 }
        responsaveis:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ResponsavelEmpresaEntrada' }
        empresaMaeId: { type: [string, 'null'], format: uuid }

    EmpresaAtualizacao:
      type: object
      description: |
        Só os campos enviados mudam. `endereco` é parcial (null apaga).
        `links`, `ferramentas`, `contatos` e `responsaveis`, quando enviados,
        SUBSTITUEM a lista inteira (mesma `versao`, mesmo 409 do formulário).
      required: [versao]
      additionalProperties: false
      properties:
        versao: { type: integer }
        nome: { type: string, minLength: 2, maxLength: 160 }
        nomeFantasia: { type: [string, 'null'], maxLength: 160 }
        razaoSocial: { type: [string, 'null'], maxLength: 200 }
        slogan: { type: [string, 'null'], maxLength: 160 }
        descricaoCurta: { type: [string, 'null'], maxLength: 280 }
        descricao: { type: [string, 'null'], maxLength: 8000 }
        segmento: { type: [string, 'null'], maxLength: 120 }
        status: { $ref: '#/components/schemas/StatusEmpresa' }
        cnpj:
          oneOf:
            - $ref: '#/components/schemas/Cnpj'
            - type: 'null'
        telefone:
          oneOf:
            - $ref: '#/components/schemas/Telefone'
            - type: 'null'
        whatsapp:
          oneOf:
            - $ref: '#/components/schemas/Telefone'
            - type: 'null'
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        links:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/LinkEmpresa' }
        ferramentas:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FerramentaEmpresa' }
        contatos:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/ContatoEmpresa' }
        endereco:
          oneOf:
            - $ref: '#/components/schemas/Endereco'
            - type: 'null'
        observacoes: { type: [string, 'null'], maxLength: 8000 }
        responsaveis:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ResponsavelEmpresaEntrada' }

    StatusEmpresa:
      type: string
      description: |
        Decidido pelo Paulo em 07/10/2026 (D-011).
        em_estruturacao = sendo preparada; ativa = operação normal;
        pausada = suspensa temporariamente; inativa = encerrada/sem operação.
      enum: [em_estruturacao, ativa, pausada, inativa]
      default: em_estruturacao

    UrlExterna:
      type: string
      format: uri
      maxLength: 500
      pattern: '^https?://[^@/]+(/.*)?$'
      description: http(s); sem usuário/senha embutidos na URL (o back recusa `user:senha@`)

    Cnpj:
      type: string
      pattern: '^[0-9]{14}$'
      description: Só dígitos; o back confere os dígitos verificadores

    LinkEmpresa:
      type: object
      description: Link ou canal da empresa. O front escolhe o ícone pelo `tipo`.
      required: [tipo, nome, url, ativo]
      additionalProperties: false
      properties:
        tipo: { $ref: '#/components/schemas/TipoLink' }
        nome: { type: string, minLength: 1, maxLength: 80, description: 'Ex. "Instagram oficial"' }
        url: { $ref: '#/components/schemas/UrlExterna' }
        ativo: { type: boolean, default: true }

    TipoLink:
      type: string
      enum: [site, instagram, facebook, linkedin, youtube, whatsapp, google_perfil, tiktok, outro]

    FerramentaEmpresa:
      type: object
      description: |
        Sistema ou ferramenta que a empresa usa e onde acessar. NUNCA guarda
        senha, token ou credencial (D-012): não há campo para isso e o back
        recusa qualquer propriedade extra.
      required: [nome, categoria, status]
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 1, maxLength: 120, description: 'Ex. "GitHub", "Google Workspace"' }
        categoria: { $ref: '#/components/schemas/CategoriaFerramenta' }
        descricao: { type: [string, 'null'], maxLength: 500 }
        url:
          oneOf:
            - $ref: '#/components/schemas/UrlExterna'
            - type: 'null'
        observacao: { type: [string, 'null'], maxLength: 1000 }
        status: { $ref: '#/components/schemas/StatusFerramenta' }

    CategoriaFerramenta:
      type: string
      enum: [crm, financeiro, rastreamento, desenvolvimento, produtividade, marketing, sistema_interno, hospedagem, dominio, analytics, outro]

    StatusFerramenta:
      type: string
      description: em_uso = usada hoje; em_implantacao = sendo adotada; descontinuada = não se usa mais (fica como registro)
      enum: [em_uso, em_implantacao, descontinuada]
      default: em_uso

    EmpresaResumo:
      type: object
      description: Forma curta da empresa, embutida no projeto e no documento
      required: [id, nome, logoUrl]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        logoUrl: { type: [string, 'null'], format: uri-reference, description: "Caminho na própria API, lido com a sessão (D-013)" }

    StatusProjeto:
      type: string
      description: Aprovado pelo Paulo em 07/10/2026 (D-011)
      enum: [nao_iniciado, em_andamento, bloqueado, pausado, concluido, cancelado]
      default: nao_iniciado

    Fase:
      type: string
      description: Aprovado pelo Paulo em 07/10/2026 (D-011)
      enum: [descoberta, planejamento, execucao, validacao, entrega]
      default: descoberta

    Prioridade:
      type: string
      enum: [baixa, media, alta, critica]
      default: media

    NotaAndamento:
      type: object
      description: Atualização escrita pelo gestor ou responsável ("onde estamos")
      required: [id, texto, em, autor]
      properties:
        id: { type: string, format: uuid }
        texto: { type: string }
        em: { type: string, format: date-time }
        autor:
          oneOf:
            - $ref: '#/components/schemas/AtorResumo'
            - type: 'null'

    NotaAndamentoEntrada:
      type: object
      required: [texto]
      additionalProperties: false
      properties:
        texto: { type: string, minLength: 1, maxLength: 4000 }

    Projeto:
      type: object
      required: [id, empresaId, empresa, nome, descricao, objetivo, status, fase, prioridade, progresso, responsavel, inicioPrevisto, prazoPrevisto, concluidoEm, ultimaAtualizacao, proximaAcao, criadoEm, atualizadoEm, versao]
      properties:
        id: { type: string, format: uuid }
        empresaId: { type: string, format: uuid }
        empresa: { $ref: '#/components/schemas/EmpresaResumo' }
        nome: { type: string }
        descricao: { type: [string, 'null'] }
        objetivo: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/StatusProjeto' }
        fase: { $ref: '#/components/schemas/Fase' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        progresso:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentual informado pelo gestor (manual no MVP)
        responsavel:
          description: Ator responsável (pessoa, agente ou automação); null se ninguém
          oneOf:
            - $ref: '#/components/schemas/AtorResumo'
            - type: 'null'
        inicioPrevisto: { type: [string, 'null'], format: date }
        prazoPrevisto: { type: [string, 'null'], format: date }
        concluidoEm:
          type: [string, 'null']
          format: date-time
          description: Preenchido pelo back quando o status vira `concluido`; volta a null se sair dele
        ultimaAtualizacao:
          oneOf:
            - $ref: '#/components/schemas/NotaAndamento'
            - type: 'null'
        proximaAcao:
          type: [string, 'null']
          description: O que precisa acontecer agora (uma linha, ex. "Aguardando aprovação da diretoria")
        criadoEm: { type: string, format: date-time }
        atualizadoEm:
          type: string
          format: date-time
          description: Última alteração de qualquer campo (diferente de `ultimaAtualizacao`)
        versao: { type: integer }

    ProjetoEntrada:
      type: object
      required: [empresaId, nome]
      additionalProperties: false
      properties:
        empresaId: { type: string, format: uuid }
        nome: { type: string, minLength: 2, maxLength: 160 }
        descricao: { type: [string, 'null'], maxLength: 4000 }
        objetivo: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/StatusProjeto' }
        fase: { $ref: '#/components/schemas/Fase' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        progresso: { type: integer, minimum: 0, maximum: 100, default: 0 }
        responsavelId:
          type: [string, 'null']
          format: uuid
          description: '`id` de um ator ativo (ver `listarAtores`)'
        inicioPrevisto: { type: [string, 'null'], format: date }
        prazoPrevisto: { type: [string, 'null'], format: date }
        proximaAcao: { type: [string, 'null'], maxLength: 500 }

    ProjetoAtualizacao:
      type: object
      required: [versao]
      additionalProperties: false
      properties:
        versao: { type: integer }
        nome: { type: string, minLength: 2, maxLength: 160 }
        descricao: { type: [string, 'null'], maxLength: 4000 }
        objetivo: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/StatusProjeto' }
        fase: { $ref: '#/components/schemas/Fase' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        progresso: { type: integer, minimum: 0, maximum: 100 }
        responsavelId:
          type: [string, 'null']
          format: uuid
          description: '`id` de um ator ativo (ver `listarAtores`)'
        inicioPrevisto: { type: [string, 'null'], format: date }
        prazoPrevisto: { type: [string, 'null'], format: date }
        proximaAcao: { type: [string, 'null'], maxLength: 500 }

    TipoDocumento:
      type: string
      enum: [github, figma, google_drive, homologacao, documentacao, apresentacao, outro]

    Documento:
      type: object
      description: Documento ou link de um projeto. MVP só com links (D-012); upload fica para depois.
      required: [id, projetoId, projeto, empresa, nome, tipo, url, observacao, autor, criadoEm, atualizadoEm, versao]
      properties:
        id: { type: string, format: uuid }
        projetoId: { type: string, format: uuid }
        projeto:
          type: object
          required: [id, nome]
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        empresa: { $ref: '#/components/schemas/EmpresaResumo' }
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoDocumento' }
        url: { $ref: '#/components/schemas/UrlExterna' }
        observacao: { type: [string, 'null'] }
        autor:
          description: Quem registrou; null se o ator foi removido
          oneOf:
            - $ref: '#/components/schemas/AtorResumo'
            - type: 'null'
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
        versao: { type: integer }

    DocumentoEntrada:
      type: object
      required: [projetoId, nome, tipo, url]
      additionalProperties: false
      properties:
        projetoId: { type: string, format: uuid }
        nome: { type: string, minLength: 1, maxLength: 160 }
        tipo: { $ref: '#/components/schemas/TipoDocumento' }
        url: { $ref: '#/components/schemas/UrlExterna' }
        observacao: { type: [string, 'null'], maxLength: 1000 }

    DocumentoAtualizacao:
      type: object
      required: [versao]
      additionalProperties: false
      properties:
        versao: { type: integer }
        nome: { type: string, minLength: 1, maxLength: 160 }
        tipo: { $ref: '#/components/schemas/TipoDocumento' }
        url: { $ref: '#/components/schemas/UrlExterna' }
        observacao: { type: [string, 'null'], maxLength: 1000 }

    Painel:
      type: object
      description: Home "Hoje na Facilitcorp". Só contagem, sem IA (D-012).
      required: [totalEmpresas, projetosAtivos, projetosBloqueados, projetosProximosDoPrazo, projetosConcluidosRecentemente, janelaPrazoDias, janelaConcluidosDias, geradoEm]
      properties:
        totalEmpresas: { type: integer, minimum: 0, description: Empresas não inativas }
        projetosAtivos: { type: integer, minimum: 0, description: Status em_andamento }
        projetosBloqueados: { type: integer, minimum: 0 }
        projetosProximosDoPrazo:
          type: integer
          minimum: 0
          description: Prazo vencido ou dentro da janela, com status não final (inclui atrasados)
        projetosConcluidosRecentemente: { type: integer, minimum: 0 }
        janelaPrazoDias: { type: integer, minimum: 1, description: 'Hoje 7; configuração do back' }
        janelaConcluidosDias: { type: integer, minimum: 1, description: 'Hoje 30; configuração do back' }
        geradoEm: { type: string, format: date-time }

    TipoEvento:
      type: string
      description: |
        Identificadores estáveis (D-009); novos tipos só se acrescentam.
        O front trata tipo desconhecido como genérico (não quebra a tela).
      enum:
        - company.created
        - company.updated
        - project.created
        - project.updated
        - demand.created
        - task.completed
        - decision.created
        - decision.approved
        - project.blocked
        - project.unblocked
        - document.added

    Evento:
      type: object
      required: [id, tipo, ocorreuEm, autor, empresaId, projetoId, alvo, dados]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoEvento' }
        ocorreuEm: { type: string, format: date-time }
        autor:
          description: Quem causou o evento; null quando foi o próprio sistema
          oneOf:
            - $ref: '#/components/schemas/AtorResumo'
            - type: 'null'
        empresaId: { type: [string, 'null'], format: uuid }
        projetoId: { type: [string, 'null'], format: uuid }
        alvo:
          type: object
          required: [tipo, id]
          properties:
