name: seguranca

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI direto: a gitleaks-action@v2 exige licença paga em repositório de organização.
      - name: gitleaks (histórico inteiro)
        env:
          GITLEAKS_VERSAO: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  vite-sem-segredo:
    name: nenhum segredo em VITE_*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: procurar VITE_ com nome de segredo
        run: |
          if grep -rInE 'VITE_[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD|SENHA|PRIVATE)' \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude=CONTRIBUTING.md --exclude=seguranca.yml . ; then
            echo "::error::Variável VITE_ com nome de segredo. VITE_* vai para o navegador."
            exit 1
          fi
